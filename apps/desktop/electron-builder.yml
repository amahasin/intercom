# Per-user NSIS installer (plan section 15). Installs to %LOCALAPPDATA%\Programs\InterCom
# without elevation; one UAC prompt adds the firewall rules. Start-with-Windows arrives in M2.
# The appId stays the one OfficeMesh shipped with, so installing InterCom upgrades it in place
# (same uninstall entry, same notification identity) instead of sitting beside it.
appId: app.officemesh.desktop
productName: InterCom
copyright: Copyright © 2026 InterCom contributors

directories:
  output: release
  buildResources: build

# Everything except the native SQLite binding is bundled into dist/ by scripts/build.mjs.
files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  # better-sqlite3 loads prebuilds/win32-<arch>.node; ship only that, not its sources.
  - '!**/node_modules/better-sqlite3/{deps,src,build}/**'
  - '!**/node_modules/better-sqlite3/binding.gyp'
  - '!**/node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*'
  - '!**/node_modules/better-sqlite3/lib/{darwin,linux,linuxmusl}-*'

extraResources:
  - from: resources/firewall.ps1
    to: firewall.ps1
  # Remote control: the helper that turns a colleague's mouse and keyboard into input.
  - from: dist/main/rcinput.exe
    to: rcinput.exe
  # Remote help: the helper that shares this desktop with a colleague, or shows theirs.
  - from: dist/main/intercom-assist.exe
    to: intercom-assist.exe
  # The meeting relay's media worker (M6). Its JavaScript is bundled into core-host; only
  # the prebuilt x64 executable ships. ARM64 builds carry it too but never start it.
  - from: node_modules/mediasoup/worker/out/Release/mediasoup-worker.exe
    to: relay/mediasoup-worker.exe

asarUnpack:
  - '**/*.node'

# better-sqlite3 ships N-API prebuilds for win32 x64 and arm64 that load in Electron
# as-is, so no Electron-specific rebuild (or C++ toolchain) is needed.
npmRebuild: false

electronLanguages:
  - en-US

# Lock down the shipped Electron binary.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  icon: build/icon.ico
  executableName: InterCom
  target:
    - target: nsis

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: InterCom
  deleteAppDataOnUninstall: false
  # Firewall rules at install, removed at uninstall (one elevation prompt each).
  include: build/installer.nsh
  artifactName: InterCom-Setup-${version}-${arch}.${ext}
