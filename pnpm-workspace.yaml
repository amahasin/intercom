packages:
  - packages/*
  - apps/*
  - tools/*
  - tests/*

saveExact: true

# Only these dependencies may run install scripts (native builds, binary downloads).
allowBuilds:
  # Ships N-API prebuilds for win32 x64/arm64; skip the redundant node-gyp compile.
  better-sqlite3: false
  electron: true
  # Squirrel installer support pulled in by electron-builder; unused (we ship NSIS).
  electron-winstaller: false
  esbuild: true
  # Downloads the prebuilt mediasoup-worker.exe (win32-x64) at install; no C++ toolchain.
  mediasoup: true
