name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (includes process-boundary rules and branding check)
        run: pnpm lint

      - name: Build (typecheck, bundle, no-network-origins check)
        run: pnpm build

      - name: Protocol docs are current
        run: |
          pnpm docs:protocol
          git diff --exit-code -- docs/protocol.md

      - name: Unit and multi-peer integration tests
        run: pnpm test

      - name: UI end-to-end (Electron, two profiles)
        run: pnpm e2e

      - name: Package installers (x64, arm64)
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter @officemesh/desktop dist

      - name: Smoke-test packaged app
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/scripts/smoke-packaged.mjs

      - name: Upload installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: apps/desktop/release/*.exe

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
